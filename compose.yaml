services:
  db:
    image: postgres:17-alpine
    container_name: fastify-starter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastify_starter
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastify_starter"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_test:
    image: postgres:17-alpine
    container_name: fastify-starter-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastify_starter_test
    ports:
      - "5433:5432"
    volumes:
      - db_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastify_starter_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  db_test_data:
